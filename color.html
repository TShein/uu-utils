<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Converter</title>
<style>
:root{--bg:#0f0f1a;--surface:#161625;--border:#2a2a40;--text:#e4e4ed;--text-dim:#787890;--accent:#7c8bff;--accent-soft:rgba(124,139,255,0.12);--green:#5ecb8c;--amber:#f0a060;--rose:#f07090;--radius:10px;--radius-sm:6px;--font-mono:"SF Mono","Fira Code","JetBrains Mono",Consolas,monospace;--font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
[data-theme="light"]{--bg:#fafafe;--surface:#fff;--border:#e4e4ec;--text:#1a1a28;--text-dim:#8c8ca0;--accent:#5b6cf0;--accent-soft:rgba(91,108,240,0.08);--green:#3b9a60;--amber:#d68040;--rose:#d05068}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);min-height:100vh;display:flex}
.sidebar{width:200px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:24px 0;min-height:100vh}
.sidebar-brand{padding:0 20px 20px;border-bottom:1px solid var(--border);margin-bottom:8px}
.sidebar-brand .name{font-size:20px;font-weight:700;color:var(--accent)}
.sidebar-brand .sub{font-size:11px;color:var(--text-dim);margin-top:2px}
.sidebar-nav{flex:1;padding:8px 0}
.sidebar-nav a{display:flex;align-items:center;gap:10px;padding:10px 20px;color:var(--text-dim);text-decoration:none;font-size:14px;transition:all .12s;border-left:3px solid transparent}
.sidebar-nav a:hover{color:var(--text);background:rgba(124,139,255,.06)}
.sidebar-nav a.active{color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft)}
.sidebar-nav a .icon{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.sidebar-bottom{padding:16px 20px;border-top:1px solid var(--border)}
.sidebar-bottom button{width:100%;padding:8px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);cursor:pointer;font-size:13px;font-family:var(--font-sans);transition:all .12s}
.sidebar-bottom button:hover{border-color:var(--accent)}
.main-content{flex:1;overflow-y:auto;min-width:0}
.container{max-width:680px;padding:28px 36px 40px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px}
.card-title{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title::before{content:"";width:3px;height:14px;background:var(--accent);border-radius:2px}

/* preview */
.color-swatch{width:100%;height:120px;border-radius:var(--radius);border:2px solid var(--border);margin-bottom:16px;transition:all .2s;position:relative;overflow:hidden}
.color-swatch .hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:13px;color:rgba(255,255,255,.4);pointer-events:none}

/* input */
.input-row{display:flex;gap:10px;margin-bottom:10px;align-items:center}
input{flex:1;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--font-mono);font-size:15px;outline:none;transition:border-color .15s;letter-spacing:.5px}
input:focus{border-color:var(--accent)}
input.error{border-color:var(--rose)}
.btn{padding:8px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:13px;cursor:pointer;transition:all .15s;font-family:var(--font-sans);white-space:nowrap}
.btn:hover{border-color:var(--accent)}

.color-picker{width:40px;height:40px;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;padding:2px;background:transparent}
.color-picker::-webkit-color-swatch-wrapper{padding:0}
.color-picker::-webkit-color-swatch{border:none;border-radius:3px}

/* result cards */
.fmt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.fmt-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px}
.fmt-card .label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.fmt-card .val{font-family:var(--font-mono);font-size:16px;color:var(--text);word-break:break-all;cursor:pointer;user-select:all;transition:color .15s}
.fmt-card .val:hover{color:var(--accent)}
.fmt-card .sub{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);margin-top:4px}

.palette{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.palette .chip{width:36px;height:36px;border-radius:6px;cursor:pointer;transition:all .12s;border:2px solid transparent}
.palette .chip:hover{transform:scale(1.15);border-color:var(--accent)}

::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#585b70;border-radius:3px}
.toast{position:fixed;top:20px;right:20px;background:var(--green);color:var(--bg);padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;opacity:0;transform:translateY(-10px);transition:all .25s;pointer-events:none;z-index:100}
.toast.show{opacity:1;transform:translateY(0)}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar"></aside>
<div class="main-content"><div class="container">

  <div class="card">
    <div class="card-title">颜色预览</div>
    <div class="color-swatch" id="swatch"><div class="hint">选择或输入颜色</div></div>
    <div class="palette" id="palette"></div>
    <div class="input-row">
      <input type="color" class="color-picker" id="nativePicker" value="#7c8bff">
      <input type="text" id="colorInput" placeholder="#7c8bff / rgb(124,139,255) / hsl(234,100%,75%)" spellcheck="false">
      <button class="btn" id="btnParse">转换</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">转换结果（点击复制）</div>
    <div class="fmt-grid" id="fmtGrid"></div>
  </div>

</div></div>

<div class="deco">
<svg viewBox="0 0 200 200">
  <defs><clipPath id="circle"><circle cx="100" cy="100" r="80"/></clipPath></defs>
  <g clip-path="url(#circle)">
    <rect x="0" y="0" width="100" height="100" fill="#f07090"/>
    <rect x="100" y="0" width="100" height="100" fill="#f0a060"/>
    <rect x="0" y="100" width="100" height="100" fill="#5ec4d0"/>
    <rect x="100" y="100" width="100" height="100" fill="#7c8bff"/>
  </g>
</svg>
</div>
<div class="toast" id="toast"></div>

<script src="nav.js"></script>
<script>
(function(){
  initSidebar("color");
  var swatch=document.getElementById("swatch"),picker=document.getElementById("nativePicker");
  var colorInput=document.getElementById("colorInput"),fmtGrid=document.getElementById("fmtGrid");
  var palette=document.getElementById("palette"),toastEl=document.getElementById("toast");

  var DEFAULT_COLORS=["#7c8bff","#5ecb8c","#f0a060","#f07090","#5ec4d0","#e4e4ed","#3b3b50","#ff6b6b","#ffd93d","#6bcb77","#4d96ff","#ff922b"];

  /* build palette */
  DEFAULT_COLORS.forEach(function(c){
    var chip=document.createElement("div");chip.className="chip";
    chip.style.background=c;chip.title=c;
    chip.addEventListener("click",function(){setColor(c)});
    palette.appendChild(chip);
  });

  function parseHex(v){
    v=v.replace(/^#/,"");
    if(v.length===3) v=v[0]+v[0]+v[1]+v[1]+v[2]+v[2];
    if(!/^[a-fA-F\d]{6}$/.test(v)) return null;
    return{type:"hex",r:parseInt(v.substr(0,2),16),g:parseInt(v.substr(2,2),16),b:parseInt(v.substr(4,2),16)};
  }
  function parseRgb(v){
    var m=v.match(/rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)/i);
    if(!m) return null;
    var r=parseInt(m[1]),g=parseInt(m[2]),b=parseInt(m[3]);
    if(r>255||g>255||b>255) return null;
    return{type:"rgb",r:r,g:g,b:b};
  }
  function parseHsl(v){
    var m=v.match(/hsl\(\s*(\d+)\s*,\s*(\d+)%\s*,\s*(\d+)%\s*\)/i);
    if(!m) return null;
    var h=parseInt(m[1])%360,s=parseInt(m[2]),l=parseInt(m[3]);
    if(s>100||l>100) return null;
    return{type:"hsl",h:h,s:s,l:l};
  }
  function hslToRgb(h,s,l){
    h/=360;s/=100;l/=100;
    var r,g,b;
    if(s===0){r=g=b=l}
    else{
      var q=l<.5?l*(1+s):l+s-l*s,p=2*l-q;
      function hue(t){if(t<0)t+=1;if(t>1)t-=1;return t<1/6?p+(q-p)*6*t:t<1/2?q:t<2/3?p+(q-p)*(2/3-t)*6:p}
      r=hue(h+1/3);g=hue(h);b=hue(h-1/3);
    }
    return{r:Math.round(r*255),g:Math.round(g*255),b:Math.round(b*255)};
  }
  function rgbToHsl(r,g,b){
    r/=255;g/=255;b/=255;
    var max=Math.max(r,g,b),min=Math.min(r,g,b),h=0,s=0,l=(max+min)/2;
    if(max!==min){
      var d=max-min;s=l>.5?d/(2-max-min):d/(max+min);
      if(max===r) h=((g-b)/d+(g<b?6:0))/6;
      else if(max===g) h=((b-r)/d+2)/6;
      else h=((r-g)/d+4)/6;
    }
    return{h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)};
  }
  function toHex(n){var s=n.toString(16);return s.length===1?"0"+s:s}

  function setColor(hex){
    picker.value=hex;colorInput.value=hex;
    update(hex);
  }
  function update(input){
    var rgb=null;
    if(!input){showEmpty();return}
    /* try parse */
    if(input.startsWith("#")) rgb=parseHex(input);
    if(!rgb) rgb=parseRgb(input);
    if(!rgb) rgb=parseHsl(input);
    if(!rgb && /^[a-fA-F\d]{3,6}$/i.test(input)) rgb=parseHex("#"+input);
    if(!rgb) rgb=parseRgb("rgb("+input+")");
    if(!rgb){showEmpty();return}

    if(rgb.type==="hsl"){var c=hslToRgb(rgb.h,rgb.s,rgb.l);rgb.r=c.r;rgb.g=c.g;rgb.b=c.b}

    var hex="#"+toHex(rgb.r)+toHex(rgb.g)+toHex(rgb.b);
    var hsl=rgbToHsl(rgb.r,rgb.g,rgb.b);
    var r=rgb.r,g=rgb.g,b=rgb.b;

    swatch.style.background=hex;
    swatch.querySelector(".hint").textContent="";
    colorInput.value=hex;colorInput.classList.remove("error");
    picker.value=hex;

    fmtGrid.innerHTML=''+
      '<div class="fmt-card"><div class="label">HEX</div><div class="val" data-copy="'+hex+'">'+hex+'</div></div>'+
      '<div class="fmt-card"><div class="label">RGB</div><div class="val" data-copy="rgb('+r+', '+g+', '+b+')">rgb('+r+', '+g+', '+b+')</div><div class="sub">R:'+r+' G:'+g+' B:'+b+'</div></div>'+
      '<div class="fmt-card"><div class="label">HSL</div><div class="val" data-copy="hsl('+hsl.h+', '+hsl.s+'%, '+hsl.l+'%)">hsl('+hsl.h+', '+hsl.s+'%, '+hsl.l+'%)</div><div class="sub">色相:'+hsl.h+'° 饱和:'+hsl.s+'% 亮度:'+hsl.l+'%</div></div>'+
      '<div class="fmt-card"><div class="label">RGBA</div><div class="val" data-copy="rgba('+r+', '+g+', '+b+', 0.5)">rgba('+r+', '+g+', '+b+', 0.5)</div></div>'+
      '<div class="fmt-card"><div class="label">HSLA</div><div class="val" data-copy="hsla('+hsl.h+', '+hsl.s+'%, '+hsl.l+'%, 0.5)">hsla('+hsl.h+', '+hsl.s+'%, '+hsl.l+'%, 0.5)</div></div>'+
      '<div class="fmt-card"><div class="label">色调</div><div class="val" data-copy="'+hex+'">'+getShadeName(hsl.h)+'</div></div>';

    /* bind copy */
    fmtGrid.querySelectorAll(".val").forEach(function(el){
      el.addEventListener("click",function(){copy(this.getAttribute("data-copy"))});
    });
  }
  function showEmpty(){
    swatch.style.background="transparent";
    swatch.querySelector(".hint").textContent="选择或输入颜色";
    fmtGrid.innerHTML='';
  }
  function getShadeName(h){
    if(h<15||h>=345) return "红色系";
    if(h<45) return "橙色系";
    if(h<75) return "黄色系";
    if(h<150) return "绿色系";
    if(h<210) return "青色系";
    if(h<270) return "蓝色系";
    if(h<330) return "紫色系";
    return "红色系";
  }

  colorInput.addEventListener("input",function(){update(this.value.trim())});
  document.getElementById("btnParse").addEventListener("click",function(){update(colorInput.value.trim())});
  colorInput.addEventListener("keydown",function(e){if(e.key==="Enter") update(this.value.trim())});
  picker.addEventListener("input",function(){setColor(this.value)});

  function copy(t){navigator.clipboard.writeText(t).then(function(){showToast("已复制")})}

  /* Theme */
  
  var tmr;function showToast(m){clearTimeout(tmr);toastEl.textContent=m;toastEl.classList.add("show");tmr=setTimeout(function(){toastEl.classList.remove("show")},1500)}
  setColor("#7c8bff");
})();
</script>
</body>
</html>
