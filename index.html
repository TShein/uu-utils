<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Util</title>
<style>
  :root {
    --bg: #1e1e2e; --panel: #252536; --border: #3a3a5c;
    --text: #cdd6f4; --text-dim: #6c7086;
    --accent: #89b4fa; --success: #a6e3a1;
    --hover: #313244; --radius: 8px;
    --font-sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--font-sans); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  h1 { font-size: 28px; color: var(--accent); margin-bottom: 8px; }
  .sub { color: var(--text-dim); font-size: 14px; margin-bottom: 36px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; max-width: 640px; width: 100%; padding: 0 20px; }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 24px 20px;
    text-decoration: none; transition: all 0.2s;
    display: flex; flex-direction: column; gap: 10px;
  }
  .card:hover { border-color: var(--accent); background: var(--hover); }
  .card .icon { font-size: 28px; }
  .card .name { font-size: 17px; font-weight: 600; color: var(--text); }
  .card .desc { font-size: 12px; color: var(--text-dim); line-height: 1.5; }
</style>
</head>
<body>
  <h1>Util</h1>
  <div class="sub">开发者常用小工具集</div>

  <div class="grid">
    <a class="card" href="json-formatter.html">
      <div class="icon">{ }</div>
      <div class="name">JSON Formatter</div>
      <div class="desc">JSON 格式化、树形折叠展开、错误定位</div>
    </a>
    <a class="card" href="timestamp.html">
      <div class="icon">⏱</div>
      <div class="name">Timestamp</div>
      <div class="desc">实时时间戳、双向转换、秒/毫秒</div>
    </a>
    <a class="card" href="cron.html">
      <div class="icon">🕐</div>
      <div class="name">Cron</div>
      <div class="desc">Cron 表达式解析、下次执行时间</div>
    </a>
  </div>
</body>
</html>
