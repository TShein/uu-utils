<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator</title>
<style>
  :root {
    --bg: #1e1e2e; --panel: #252536; --border: #3a3a5c;
    --text: #cdd6f4; --text-dim: #6c7086;
    --accent: #89b4fa; --success: #a6e3a1; --warn: #fab387; --error: #f38ba8;
    --hover: #313244; --scrollbar-thumb: #585b70;
    --radius: 8px; --radius-sm: 4px;
    --font-mono: "SF Mono","Fira Code","Cascadia Code","JetBrains Mono",Consolas,monospace;
    --font-sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  [data-theme="light"] {
    --bg: #f4f4f5; --panel: #ffffff; --border: #d4d4d8;
    --text: #18181b; --text-dim: #71717a;
    --accent: #2563eb; --success: #16a34a; --warn: #ea580c; --error: #dc2626;
    --hover: #e4e4e7; --scrollbar-thumb: #a1a1aa;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--font-sans); min-height: 100vh; display: flex;
  }

  /* Sidebar */
  .sidebar {
    width: 200px; flex-shrink: 0; background: var(--panel);
    border-right: 1px solid var(--border); display: flex;
    flex-direction: column; padding: 24px 0; min-height: 100vh;
  }
  .sidebar-brand { padding: 0 20px 20px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
  .sidebar-brand .name { font-size: 20px; font-weight: 700; color: var(--accent); }
  .sidebar-brand .sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .sidebar-nav { flex: 1; padding: 8px 0; }
  .sidebar-nav a {
    display: flex; align-items: center; gap: 10px; padding: 10px 20px;
    color: var(--text-dim); text-decoration: none; font-size: 14px;
    transition: all 0.12s; border-left: 3px solid transparent;
  }
  .sidebar-nav a:hover { color: var(--text); background: var(--hover); }
  .sidebar-nav a.active { color: var(--accent); border-left-color: var(--accent); background: rgba(137,180,250,0.08); }
  .sidebar-nav a .icon { font-size: 18px; width: 24px; text-align: center; flex-shrink: 0; }
  .sidebar-bottom { padding: 16px 20px; border-top: 1px solid var(--border); }
  .sidebar-bottom button {
    width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg); color: var(--text); cursor: pointer; font-size: 13px;
    font-family: var(--font-sans); transition: all 0.12s;
  }
  .sidebar-bottom button:hover { border-color: var(--accent); }

  /* Content */
  .main-content { flex: 1; overflow-y: auto; min-width: 0; display: flex; }
  .deco { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; opacity: 0.07; min-width: 0; }
  .deco svg { width: 280px; height: 280px; color: var(--text); }
  .container { max-width: 560px; padding: 40px 36px; }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 24px; margin-bottom: 16px;
  }
  .card-title {
    font-size: 12px; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: 1px; font-weight: 600; margin-bottom: 18px;
    display: flex; align-items: center; gap: 8px;
  }
  .card-title::before { content: ""; width: 3px; height: 14px; background: var(--accent); border-radius: 2px; }

  /* Password display */
  .pw-display {
    background: var(--bg); border: 2px solid var(--border);
    border-radius: var(--radius); padding: 16px 20px;
    display: flex; align-items: center; gap: 12px; margin-bottom: 24px;
    transition: border-color 0.2s;
  }
  .pw-display:focus-within { border-color: var(--accent); }
  .pw-display .pw-text {
    flex: 1; font-family: var(--font-mono); font-size: 20px;
    letter-spacing: 2px; word-break: break-all; user-select: all;
    min-height: 30px; display: flex; align-items: center;
  }
  .pw-display .pw-placeholder { color: var(--text-dim); font-family: var(--font-sans); font-size: 15px; letter-spacing: 0; }
  .pw-display .pw-actions { display: flex; gap: 8px; flex-shrink: 0; }

  .btn {
    padding: 8px 16px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--bg); color: var(--text); font-size: 13px; cursor: pointer;
    transition: all 0.15s; font-family: var(--font-sans); white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: var(--hover); border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }

  /* Strength bar */
  .strength { margin-bottom: 20px; }
  .strength-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; }
  .strength-val { font-weight: 600; }
  .strength-bar {
    height: 5px; background: var(--bg); border-radius: 3px; overflow: hidden;
  }
  .strength-fill { height: 100%; border-radius: 3px; transition: all 0.3s; }
  .strength-fill.l0 { width: 0; }
  .strength-fill.l1 { width: 25%; background: var(--error); }
  .strength-fill.l2 { width: 50%; background: var(--warn); }
  .strength-fill.l3 { width: 75%; background: var(--warn); }
  .strength-fill.l4 { width: 100%; background: var(--success); }

  /* Length control */
  .length-control { margin-bottom: 20px; }
  .length-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .length-val {
    font-family: var(--font-mono); font-size: 22px; font-weight: 700; color: var(--accent);
  }
  .length-custom {
    display: flex; align-items: center; gap: 6px;
  }
  .length-custom input {
    width: 56px; padding: 4px 8px; text-align: center;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text);
    font-family: var(--font-mono); font-size: 14px; outline: none;
  }
  .length-custom input:focus { border-color: var(--accent); }
  .length-custom span { font-size: 12px; color: var(--text-dim); }

  input[type="range"] {
    -webkit-appearance: none; width: 100%; height: 6px;
    background: var(--bg); border-radius: 3px; outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 20px; height: 20px;
    background: var(--accent); border-radius: 50%; cursor: pointer; border: none;
  }

  .presets { display: flex; gap: 6px; margin-bottom: 8px; }
  .preset {
    padding: 2px 10px; border: 1px solid var(--border); border-radius: 12px;
    font-size: 11px; color: var(--text-dim); cursor: pointer; font-family: var(--font-mono);
    transition: all 0.12s;
  }
  .preset:hover { border-color: var(--accent); color: var(--text); }

  /* Toggle */
  .toggles { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; background: var(--bg); border-radius: var(--radius-sm);
  }
  .toggle-label { font-size: 14px; }
  .toggle-label .desc { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
  .switch {
    position: relative; width: 44px; height: 24px; flex-shrink: 0;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider {
    position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
    background: var(--border); border-radius: 12px; transition: 0.2s;
  }
  .switch .slider::before {
    content: ""; position: absolute; height: 18px; width: 18px;
    left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.2s;
  }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(20px); }

  .error-msg { color: var(--error); font-size: 13px; margin-top: 8px; display: none; }
  .error-msg.show { display: block; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }

  .toast {
    position: fixed; top: 20px; right: 20px; background: var(--success); color: var(--bg);
    padding: 8px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600;
    opacity: 0; transform: translateY(-10px); transition: all 0.25s; pointer-events: none; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>
<aside class="sidebar" id="sidebar"></aside>

<div class="main-content">
<div class="container">

  <div class="card">
    <div class="card-title">生成密码</div>

    <!-- Display -->
    <div class="pw-display" id="pwDisplay">
      <div class="pw-text"><span class="pw-placeholder" id="pwPlaceholder">点击生成</span><span id="pwText" style="display:none"></span></div>
      <div class="pw-actions">
        <button class="btn" id="btnCopy" disabled>复制</button>
        <button class="btn primary" id="btnGenerate">生成</button>
      </div>
    </div>

    <!-- Strength -->
    <div class="strength">
      <div class="strength-label">
        <span>密码强度</span>
        <span class="strength-val" id="strengthLabel">--</span>
      </div>
      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
    </div>

    <!-- Length -->
    <div class="length-control">
      <div class="length-top">
        <span class="length-val" id="lengthVal">16</span>
        <div class="length-custom">
          <span>自定义</span>
          <input type="text" id="customLen" placeholder="16" maxlength="3" pattern="\d*" inputmode="numeric">
        </div>
      </div>
      <div class="presets">
        <span class="preset" data-len="8">8</span>
        <span class="preset" data-len="12">12</span>
        <span class="preset" data-len="16">16</span>
        <span class="preset" data-len="20">20</span>
        <span class="preset" data-len="24">24</span>
        <span class="preset" data-len="32">32</span>
        <span class="preset" data-len="48">48</span>
        <span class="preset" data-len="64">64</span>
      </div>
      <input type="range" id="lenSlider" min="6" max="64" value="16" step="1">
    </div>

    <!-- Toggles -->
    <div class="toggles">
      <label class="toggle-row">
        <div class="toggle-label">小写字母 <div class="desc">a-z</div></div>
        <label class="switch"><input type="checkbox" id="toggleLower" checked><span class="slider"></span></label>
      </label>
      <label class="toggle-row">
        <div class="toggle-label">大写字母 <div class="desc">A-Z</div></div>
        <label class="switch"><input type="checkbox" id="toggleUpper" checked><span class="slider"></span></label>
      </label>
      <label class="toggle-row">
        <div class="toggle-label">数字 <div class="desc">0-9</div></div>
        <label class="switch"><input type="checkbox" id="toggleNumber" checked><span class="slider"></span></label>
      </label>
      <label class="toggle-row">
        <div class="toggle-label">特殊符号 <div class="desc">!@#$%^&*等</div></div>
        <label class="switch"><input type="checkbox" id="toggleSymbol" checked><span class="slider"></span></label>
      </label>
    </div>

    <div class="error-msg" id="errorMsg">至少选择一种字符类型</div>
  </div>
</div>
</div>


<div class="deco">
<svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="5">
  <rect x="65" y="80" width="70" height="70" rx="8"/>
  <path d="M100 80 V50 A30 30 0 0 1 130 80" stroke-linecap="round"/>
  <circle cx="100" cy="115" r="6" fill="currentColor"/>
  <line x1="100" y1="125" x2="100" y2="140"/>
</svg>
</div>
<div class="toast" id="toast"></div>

<script src="nav.js"></script>
<script>
(function(){
  initSidebar("password");
  var pwText = document.getElementById("pwText");
  var pwPlaceholder = document.getElementById("pwPlaceholder");
  var btnCopy = document.getElementById("btnCopy");
  var btnGen = document.getElementById("btnGenerate");
  var lenVal = document.getElementById("lengthVal");
  var lenSlider = document.getElementById("lenSlider");
  var customLen = document.getElementById("customLen");
  var toggleLower = document.getElementById("toggleLower");
  var toggleUpper = document.getElementById("toggleUpper");
  var toggleNumber = document.getElementById("toggleNumber");
  var toggleSymbol = document.getElementById("toggleSymbol");
  var errorMsg = document.getElementById("errorMsg");
  var strengthLabel = document.getElementById("strengthLabel");
  var strengthFill = document.getElementById("strengthFill");
  var toastEl = document.getElementById("toast");

  var CHARS = {
    lower: "abcdefghijklmnopqrstuvwxyz",
    upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
    number: "0123456789",
    symbol: "!@#$%^&*()_+-=[]{}|;:,.<>?/~"
  };

  var currentPw = "";

  function getLength() {
    var v = parseInt(customLen.value);
    if (customLen.value && v >= 6 && v <= 128) return v;
    return parseInt(lenSlider.value);
  }

  function setLength(n) {
    lenSlider.value = n;
    lenVal.textContent = n;
    customLen.value = "";
  }

  /* Presets */
  document.querySelectorAll(".preset").forEach(function(p){
    p.addEventListener("click", function(){ setLength(parseInt(this.getAttribute("data-len"))); generate(); });
  });

  /* Slider */
  lenSlider.addEventListener("input", function(){
    lenVal.textContent = this.value;
    customLen.value = "";
    generate();
  });

  /* Custom input */
  customLen.addEventListener("input", function(){
    var v = parseInt(this.value);
    if (v >= 6 && v <= 128) { lenVal.textContent = v; generate(); }
  });

  /* Toggles */
  [toggleLower,toggleUpper,toggleNumber,toggleSymbol].forEach(function(t){
    t.addEventListener("change", generate);
  });

  function getCharset() {
    var s = "";
    if (toggleLower.checked) s += CHARS.lower;
    if (toggleUpper.checked) s += CHARS.upper;
    if (toggleNumber.checked) s += CHARS.number;
    if (toggleSymbol.checked) s += CHARS.symbol;
    return s;
  }

  function getStrength(charsetStr, len) {
    /* score by entropy: charset size ^ length */
    var pool = charsetStr.length;
    if (pool === 0 || len === 0) return { level: 0, label: "--" };
    /* rough: bits = len * log2(pool) */
    var bits = len * Math.log2(pool);
    if (bits < 40) return { level: 1, label: "弱" };
    if (bits < 60) return { level: 2, label: "一般" };
    if (bits < 80) return { level: 3, label: "强" };
    return { level: 4, label: "非常强" };
  }

  function cryptoRandom(max) {
    var arr = new Uint32Array(1);
    crypto.getRandomValues(arr);
    return arr[0] % max;
  }

  function generate() {
    var charset = getCharset();
    if (!charset) {
      errorMsg.classList.add("show");
      pwText.style.display = "none"; pwPlaceholder.style.display = "";
      btnCopy.disabled = true;
      strengthLabel.textContent = "--"; strengthFill.className = "strength-fill l0";
      currentPw = "";
      return;
    }
    errorMsg.classList.remove("show");

    var len = getLength();
    var pw = "";
    for (var i = 0; i < len; i++) {
      pw += charset[cryptoRandom(charset.length)];
    }
    currentPw = pw;
    pwText.textContent = pw;
    pwText.style.display = ""; pwPlaceholder.style.display = "none";
    btnCopy.disabled = false;

    var s = getStrength(charset, len);
    strengthLabel.textContent = s.label;
    strengthFill.className = "strength-fill l" + s.level;
  }

  btnGen.addEventListener("click", generate);
  btnCopy.addEventListener("click", function(){
    if (!currentPw) return;
    navigator.clipboard.writeText(currentPw).then(function(){ showToast("已复制"); });
  });
  pwText.addEventListener("click", function(){
    if (!currentPw) return;
    navigator.clipboard.writeText(currentPw).then(function(){ showToast("已复制"); });
  });
  pwText.style.cursor = "pointer";

  /* Theme */
  

  var tmr;
  function showToast(msg){ clearTimeout(tmr); toastEl.textContent = msg; toastEl.classList.add("show"); tmr = setTimeout(function(){ toastEl.classList.remove("show"); }, 1500); }
})();
</script>
</body>
</html>
