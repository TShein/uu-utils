<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cron Expression</title>
<style>
  :root {
    --bg: #1e1e2e; --panel: #252536; --border: #3a3a5c;
    --text: #cdd6f4; --text-dim: #6c7086;
    --accent: #89b4fa; --success: #a6e3a1; --warn: #fab387; --error: #f38ba8;
    --hover: #313244; --radius: 8px; --radius-sm: 4px;
    --font-mono: "SF Mono","Fira Code","Cascadia Code","JetBrains Mono",Consolas,monospace;
    --font-sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }

  [data-theme="light"] {
    --bg: #f4f4f5; --panel: #ffffff; --border: #d4d4d8;
    --text: #18181b; --text-dim: #71717a;
    --accent: #2563eb; --success: #16a34a; --warn: #ea580c; --error: #dc2626;
    --hover: #e4e4e7; --scrollbar-thumb: #a1a1aa;
  }

  *{margin:0;padding:0;box-sizing:border-box}
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--font-sans); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
  }
  .container { width: 100%; padding: 24px 32px 40px; }

  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .header .left h1 { font-size: 22px; color: var(--accent); }
  .header .left .sub { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  .header .right { display: flex; align-items: center; gap: 14px; }
  .header .right a { color: var(--text-dim); font-size: 13px; text-decoration: none; }
  .header .right a:hover { color: var(--accent); }

  /* card */
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
  }
  .card-title {
    font-size: 12px; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: 1px; font-weight: 600; margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .card-title::before { content: ""; width: 3px; height: 14px; background: var(--accent); border-radius: 2px; }

  /* ── Visual Selector ── */
  .field-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .field-label {
    width: 36px; font-size: 12px; color: var(--text-dim);
    text-align: right; flex-shrink: 0;
  }
  .options {
    display: flex; flex-wrap: wrap; gap: 4px;
  }
  .opt {
    padding: 3px 10px; border: 1px solid var(--border);
    border-radius: 14px; font-size: 11px; font-family: var(--font-mono);
    color: var(--text-dim); cursor: pointer; transition: all 0.12s;
    background: var(--bg); white-space: nowrap;
  }
  .opt:hover { border-color: var(--accent); color: var(--text); }
  .opt.selected { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .opt-custom {
    font-family: var(--font-sans); font-style: italic;
    padding: 3px 8px; min-width: 60px;
  }

  .expr-preview {
    margin-top: 12px; padding: 12px 16px;
    background: var(--bg); border-radius: var(--radius-sm);
    display: flex; align-items: center; gap: 12px;
  }
  .expr-preview .expr {
    font-family: var(--font-mono); font-size: 20px; letter-spacing: 1px;
    color: var(--accent); flex: 1;
  }
  .expr-preview .human {
    font-size: 13px; color: var(--text-dim);
  }
  .copy-sm {
    padding: 4px 12px; border: 1px solid var(--border); border-radius: 3px;
    background: transparent; color: var(--text-dim); font-size: 12px;
    cursor: pointer; font-family: var(--font-sans);
  }
  .copy-sm:hover { background: var(--hover); color: var(--text); }

  /* ── Reverse ── */
  .reverse-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  }
  .rev-item {
    padding: 8px 12px; background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-sm); cursor: pointer; transition: all 0.12s;
    font-size: 13px; color: var(--text-dim);
  }
  .rev-item:hover { border-color: var(--accent); color: var(--text); background: var(--hover); }
  .rev-item .rev-expr {
    font-family: var(--font-mono); font-size: 11px; color: var(--accent); margin-top: 3px;
  }

  /* ── Run Times ── */
  .run-section { display: flex; gap: 16px; }
  .run-section .half { flex: 1; min-width: 0; }
  .run-list {
    list-style: none; font-family: var(--font-mono); font-size: 13px;
  }
  .run-list li {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: var(--radius-sm);
  }
  .run-list li + li { border-top: 1px solid var(--border); }
  .run-list li .dot {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
  }
  .run-list li .dot.past { background: var(--text-dim); }
  .run-list li .dot.next { background: var(--success); }
  .run-list li .ts {
    color: var(--text-dim); font-size: 11px; margin-left: auto;
  }
  .no-data { color: var(--text-dim); font-size: 13px; padding: 8px; }

  /* nav */
  .nav { margin-top: 20px; text-align: center; }
  .nav a { color: var(--text-dim); font-size: 13px; text-decoration: none; margin: 0 10px; }
  .nav a:hover { color: var(--accent); }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #585b70; border-radius: 3px; }

  .toast {
    position: fixed; top: 20px; right: 20px;
    background: var(--success); color: var(--bg);
    padding: 8px 16px; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 600;
    opacity: 0; transform: translateY(-10px);
    transition: all 0.25s; pointer-events: none; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="left">
      <h1>Cron</h1>
      <div class="sub">表达式可视化构建 &amp; 解析</div>
    </div>
    <div class="right">
      <a href="index.html">首页</a>
      <a href="json-formatter.html">JSON</a>
      <a href="timestamp.html">Timestamp</a>
      <button onclick="toggleTheme()" style="background:none;border:1px solid var(--border);border-radius:4px;color:var(--text-dim);cursor:pointer;font-size:14px;padding:2px 6px;line-height:1" title="切换主题" id="themeBtn">🌙</button>
    </div>
  </div>

  <!-- Visual Selector -->
  <div class="card">
    <div class="card-title">可视化选择</div>
    <div id="selector"></div>
    <div class="expr-preview">
      <span class="expr" id="exprPreview">* * * * *</span>
      <span class="human" id="exprHuman">每分钟</span>
      <button class="copy-sm" id="copyExpr">复制</button>
    </div>
  </div>

  <!-- Reverse Parse -->
  <div class="card">
    <div class="card-title">反解析（选你想要）</div>
    <div class="reverse-grid" id="reverseGrid"></div>
  </div>

  <!-- Run Times -->
  <div class="card">
    <div class="card-title">最近 &amp; 下次执行时间</div>
    <div class="run-section">
      <div class="half">
        <div style="font-size:12px;color:var(--text-dim);margin-bottom:8px">最近 5 次</div>
        <ul class="run-list" id="pastRuns"></ul>
      </div>
      <div class="half">
        <div style="font-size:12px;color:var(--text-dim);margin-bottom:8px">接下来 5 次</div>
        <ul class="run-list" id="nextRuns"></ul>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var WEEKS = ["日","一","二","三","四","五","六"];
  var pad = function(n){ return n<10?"0"+n:n; };

  /* ── Field options ── */
  var FIELD_OPTIONS = [
    /* minute */  ["*","*/5","*/10","*/15","*/30","0","15","30","45"],
    /* hour */    ["*","*/2","*/3","*/6","0","6","8","9","12","18","22"],
    /* day */     ["*","*/2","1","15","L"],
    /* month */   ["*","1","3","6","9","12"],
    /* weekday */ ["*","1-5","0","1","6","6,0"],
  ];
  var FIELD_NAMES = ["分钟","小时","日","月","星期"];
  var FIELD_RANGE = [[0,59],[0,23],[1,31],[1,12],[0,6]];

  var currentExpr = ["*","*","*","*","*"];
  var manualInput = false;

  /* ── Validation ── */
  function validateField(v, min, max) {
    if (v === "*") return true;
    if (v === "L") return true; /* last day */
    if (/^\*\/\d+$/.test(v)) { var s = parseInt(v.split("/")[1]); return s >= 1 && s <= max; }
    if (/^\d+\/\d+$/.test(v)) { var p = v.split("/"); var b = parseInt(p[0]), s = parseInt(p[1]); return b >= min && b <= max && s >= 1; }
    if (/^\d+-\d+$/.test(v)) { var r = v.split("-"); return parseInt(r[0]) >= min && parseInt(r[1]) <= max; }
    if (/^[\d,]+$/.test(v)) return v.split(",").every(function(x){ var n = parseInt(x); return n >= min && n <= max; });
    if (/^\d+$/.test(v)) { var n = parseInt(v); return n >= min && n <= max; }
    return false;
  }

  function validExpr(parts) {
    if (parts.length !== 5) return false;
    for (var i = 0; i < 5; i++) {
      var range = FIELD_RANGE[i];
      if (!validateField(parts[i], range[0], range[1]) && parts[i] !== "L") return false;
    }
    return true;
  }

  /* ── Human readable ── */
  function humanSentence(parts) {
    var s = [];
    var m = parts[0], h = parts[1], d = parts[2], mo = parts[3], w = parts[4];

    if (m === "*") s.push("每分钟");
    else if (/^\*\/\d+$/.test(m)) s.push("每"+m.split("/")[1]+"分钟");
    else s.push("第"+m+"分");

    if (h === "*") s.push("每小时");
    else if (/^\*\/\d+$/.test(h)) s.push("每"+h.split("/")[1]+"小时");
    else s.push(h+"点");

    if (d !== "*") {
      if (d === "L") s.push("最后一天");
      else if (/^\*\/\d+$/.test(d)) s.push("每"+d.split("/")[1]+"天");
      else s.push(d+"号");
    }
    if (mo !== "*") s.push(mo+"月");
    if (w !== "*") {
      if (w === "1-5") s.push("工作日");
      else if (w === "6,0" || w === "0,6") s.push("周末");
      else if (/^\d+$/.test(w)) s.push("周"+WEEKS[parseInt(w)]);
      else s.push(w);
    }
    return s.join("，");
  }

  /* ── Build selector UI ── */
  function buildSelector() {
    var html = "";
    var labels = ["分","时","日","月","周"];
    for (var i = 0; i < 5; i++) {
      var opts = FIELD_OPTIONS[i];
      html += '<div class="field-row">';
      html += '<span class="field-label">'+labels[i]+'</span>';
      html += '<div class="options">';
      for (var j = 0; j < opts.length; j++) {
        var sel = currentExpr[i] === opts[j] ? " selected" : "";
        html += '<span class="opt'+sel+'" data-field="'+i+'" data-val="'+opts[j]+'">'+opts[j]+'</span>';
      }
      /* custom input per field */
      html += '<input class="opt opt-custom" data-field="'+i+'" placeholder="自定义" value="'+(FIELD_OPTIONS[i].indexOf(currentExpr[i])===-1&&currentExpr[i]!=="*"?currentExpr[i]:"")+'" style="width:70px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:var(--font-mono);font-size:11px;padding:3px 8px;border-radius:14px;outline:none">';
      html += '</div></div>';
    }
    document.getElementById("selector").innerHTML = html;
    bindSelectorEvents();
  }

  function bindSelectorEvents() {
    /* button clicks */
    document.querySelectorAll("#selector .opt").forEach(function(el){
      if (el.classList.contains("opt-custom")) return;
      el.addEventListener("click", function(){
        var field = parseInt(this.getAttribute("data-field"));
        var val = this.getAttribute("data-val");
        currentExpr[field] = val;
        updateAll();
      });
    });
    /* custom inputs */
    document.querySelectorAll("#selector .opt-custom").forEach(function(input){
      input.addEventListener("input", function(){
        var field = parseInt(this.getAttribute("data-field"));
        currentExpr[field] = this.value.trim() || "*";
        updateAll();
      });
    });
  }

  /* ── Update everything ── */
  function updateAll() {
    var expr = currentExpr.join(" ");
    document.getElementById("exprPreview").textContent = expr;
    document.getElementById("exprHuman").textContent = humanSentence(currentExpr);
    buildSelector();
    renderRuns();
  }

  /* ── Match field ── */
  function matchField(expr, val) {
    if (expr === "*") return true;
    if (expr === "L") return false; /* handled separately */
    if (/^\*\/\d+$/.test(expr)) return val % parseInt(expr.split("/")[1]) === 0;
    if (/^\d+\/\d+$/.test(expr)) {
      var p = expr.split("/"); var b = parseInt(p[0]), s = parseInt(p[1]);
      return val >= b && (val - b) % s === 0;
    }
    if (/^\d+-\d+$/.test(expr)) {
      var r = expr.split("-"); return val >= parseInt(r[0]) && val <= parseInt(r[1]);
    }
    if (/^[\d,]+$/.test(expr)) return expr.split(",").indexOf(String(val)) !== -1;
    if (/^\d+$/.test(expr)) return val === parseInt(expr);
    return false;
  }

  function matches(parts, d) {
    return matchField(parts[0], d.getMinutes()) &&
           matchField(parts[1], d.getHours()) &&
           (parts[2] === "L" ? d.getDate() === new Date(d.getFullYear(), d.getMonth()+1, 0).getDate() : matchField(parts[2], d.getDate())) &&
           matchField(parts[3], d.getMonth()+1) &&
           matchField(parts[4], d.getDay());
  }

  /* ── Get past N + next N runs ── */
  function getRuns(parts, pastCount, nextCount) {
    var past = [], next = [];
    var now = new Date();

    /* past */
    var cursor = new Date(now);
    cursor.setSeconds(0,0);
    cursor.setMinutes(cursor.getMinutes() - 1);
    var iter = 0, maxIter = 525600; /* 1 year */
    while (past.length < pastCount && iter < maxIter) {
      cursor.setMinutes(cursor.getMinutes() - 1);
      iter++;
      if (matches(parts, cursor)) {
        past.unshift(new Date(cursor));
      }
    }

    /* next */
    cursor = new Date(now);
    cursor.setSeconds(0,0);
    iter = 0;
    while (next.length < nextCount && iter < maxIter) {
      cursor.setMinutes(cursor.getMinutes() + 1);
      iter++;
      if (matches(parts, cursor)) {
        next.push(new Date(cursor));
      }
    }
    return { past: past, next: next };
  }

  function renderRuns() {
    if (!validExpr(currentExpr)) {
      document.getElementById("pastRuns").innerHTML = '<div class="no-data">表达式无效</div>';
      document.getElementById("nextRuns").innerHTML = '<div class="no-data">表达式无效</div>';
      return;
    }

    var runs = getRuns(currentExpr, 5, 5);
    renderList("pastRuns", runs.past, "past");
    renderList("nextRuns", runs.next, "next");
  }

  function renderList(elId, dates, type) {
    var el = document.getElementById(elId);
    if (!dates.length) { el.innerHTML = '<div class="no-data">无匹配</div>'; return; }
    var html = "";
    dates.forEach(function(d){
      var str = d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+
                pad(d.getHours())+":"+pad(d.getMinutes())+":00";
      var ts = Math.floor(d.getTime()/1000);
      html += '<li>'+
        '<span class="dot '+type+'"></span>'+
        str+' <span style="color:var(--text-dim)">周'+WEEKS[d.getDay()]+'</span>'+
        '<span class="ts">'+ts+'</span>'+
      '</li>';
    });
    el.innerHTML = html;
  }

  /* ── Copy ── */
  document.getElementById("copyExpr").addEventListener("click", function(){
    navigator.clipboard.writeText(currentExpr.join(" ")).then(function(){ toast("已复制"); });
  });

  /* ── Reverse parse presets ── */
  var REVERSE_PRESETS = [
    { label: "每分钟", expr: "* * * * *" },
    { label: "每5分钟", expr: "*/5 * * * *" },
    { label: "每10分钟", expr: "*/10 * * * *" },
    { label: "每半小时", expr: "*/30 * * * *" },
    { label: "每小时整点", expr: "0 * * * *" },
    { label: "每2小时", expr: "0 */2 * * *" },
    { label: "每6小时", expr: "0 */6 * * *" },
    { label: "每天9点", expr: "0 9 * * *" },
    { label: "每天12点", expr: "0 12 * * *" },
    { label: "工作日9点", expr: "0 9 * * 1-5" },
    { label: "每周一8点", expr: "0 8 * * 1" },
    { label: "每周末0点", expr: "0 0 * * 6,0" },
    { label: "每月1号0点", expr: "0 0 1 * *" },
    { label: "每月15号9点", expr: "0 9 15 * *" },
    { label: "每月最后一天", expr: "0 0 L * *" },
    { label: "每年1月1日0点", expr: "0 0 1 1 *" },
  ];

  var rGrid = document.getElementById("reverseGrid");
  REVERSE_PRESETS.forEach(function(p){
    var div = document.createElement("div");
    div.className = "rev-item";
    div.innerHTML = p.label+'<div class="rev-expr">'+p.expr+'</div>';
    div.addEventListener("click", function(){
      currentExpr = p.expr.split(" ");
      updateAll();
    });
    rGrid.appendChild(div);
  });

  /* ── Theme ── */
  var saved = localStorage.getItem("theme") || "dark";
  document.documentElement.setAttribute("data-theme", saved);
  document.getElementById("themeBtn").textContent = saved === "light" ? "☀️" : "🌙";

  window.toggleTheme = function() {
    var cur = document.documentElement.getAttribute("data-theme");
    var next = cur === "light" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
    document.getElementById("themeBtn").textContent = next === "light" ? "☀️" : "🌙";
  };

  /* ── Init ── */
  buildSelector();
  renderRuns();

  /* ── Toast ── */
  var tmr;
  function toast(msg) {
    var el = document.getElementById("toast");
    clearTimeout(tmr);
    el.textContent = msg; el.classList.add("show");
    tmr = setTimeout(function(){ el.classList.remove("show"); }, 1500);
  }

  /* also expose expr preview click to copy */
  document.getElementById("exprPreview").addEventListener("click", function(){
    navigator.clipboard.writeText(currentExpr.join(" ")).then(function(){ toast("已复制"); });
  });
  document.getElementById("exprPreview").style.cursor = "pointer";
})();
</script>
</body>
</html>
