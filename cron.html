<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cron Expression</title>
<style>
  :root {
    --bg: #1e1e2e; --panel: #252536; --border: #3a3a5c;
    --text: #cdd6f4; --text-dim: #6c7086;
    --accent: #89b4fa; --success: #a6e3a1; --warn: #fab387; --error: #f38ba8;
    --hover: #313244; --scrollbar-thumb: #585b70;
    --radius: 8px; --radius-sm: 4px;
    --font-mono: "SF Mono","Fira Code","Cascadia Code","JetBrains Mono",Consolas,monospace;
    --font-sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--font-sans); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
  }
  .container { width: 100%; max-width: 720px; padding: 40px 20px; }

  .header { text-align: center; margin-bottom: 28px; }
  .header h1 { font-size: 24px; color: var(--accent); }
  .header .sub { color: var(--text-dim); font-size: 13px; margin-top: 4px; font-family: var(--font-mono); }
  .header .sub span { color: var(--warn); }

  /* input */
  .input-row {
    display: flex; gap: 10px; margin-bottom: 12px;
  }
  input {
    flex: 1; padding: 12px 16px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text);
    font-family: var(--font-mono); font-size: 18px;
    letter-spacing: 1px; outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: var(--accent); }
  input.error { border-color: var(--error); }

  .btn {
    padding: 10px 18px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); background: var(--panel);
    color: var(--text); font-size: 13px; cursor: pointer;
    transition: all 0.15s; font-family: var(--font-sans); white-space: nowrap;
  }
  .btn:hover { background: var(--hover); border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }

  /* presets */
  .presets {
    display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px;
  }
  .preset {
    padding: 4px 12px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; font-size: 12px; font-family: var(--font-mono);
    color: var(--text-dim); cursor: pointer; transition: all 0.12s;
  }
  .preset:hover { border-color: var(--accent); color: var(--text); }

  /* error */
  .error-msg {
    color: var(--error); font-size: 13px; padding: 8px 0;
    display: none;
  }
  .error-msg.show { display: block; }

  /* explain card */
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
  }
  .card-title {
    font-size: 12px; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: 1px; font-weight: 600; margin-bottom: 14px;
  }

  .explain-grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
  }
  .explain-item {
    background: var(--bg); border-radius: var(--radius-sm);
    padding: 10px; text-align: center;
  }
  .explain-item .field { font-size: 10px; color: var(--text-dim); text-transform: uppercase; }
  .explain-item .val { font-family: var(--font-mono); font-size: 18px; color: var(--accent); font-weight: 600; margin: 4px 0; }
  .explain-item .desc { font-size: 11px; color: var(--text-dim); line-height: 1.4; }

  .human-read {
    font-size: 15px; line-height: 1.6; padding: 12px 0;
    color: var(--success);
  }

  /* next runs */
  .next-list { list-style: none; }
  .next-list li {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 12px; border-radius: var(--radius-sm);
    font-family: var(--font-mono); font-size: 14px;
  }
  .next-list li + li { border-top: 1px solid var(--border); }
  .next-list li .idx {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--border); color: var(--text-dim);
    font-size: 11px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .next-list li .idx.upcoming { background: var(--accent); color: var(--bg); }
  .next-list li .ts {
    color: var(--text-dim); font-size: 12px; margin-left: auto;
  }
  .copy-btn {
    margin-left: auto; padding: 2px 10px; border: 1px solid var(--border);
    border-radius: 3px; background: transparent; color: var(--text-dim);
    font-size: 11px; cursor: pointer; font-family: var(--font-sans);
  }
  .copy-btn:hover { background: var(--hover); color: var(--text); }

  .nav { margin-top: 24px; text-align: center; }
  .nav a { color: var(--text-dim); font-size: 13px; text-decoration: none; margin: 0 10px; }
  .nav a:hover { color: var(--accent); }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }

  .toast {
    position: fixed; top: 20px; right: 20px;
    background: var(--success); color: var(--bg);
    padding: 8px 16px; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 600;
    opacity: 0; transform: translateY(-10px);
    transition: all 0.25s; pointer-events: none; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Cron</h1>
    <div class="sub">* <span>*</span> * * * *</div>
  </div>

  <div class="input-row">
    <input type="text" id="cronInput" placeholder="*/5 * * * *" spellcheck="false">
    <button class="btn primary" id="btnParse">解析</button>
  </div>

  <div class="presets" id="presets">
    <span class="preset">* * * * *</span>
    <span class="preset">*/5 * * * *</span>
    <span class="preset">0 * * * *</span>
    <span class="preset">0 9 * * 1-5</span>
    <span class="preset">0 0 * * *</span>
    <span class="preset">0 0 1 * *</span>
    <span class="preset">30 2 * * 0</span>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <!-- explanation -->
  <div class="card" id="explainCard" style="display:none">
    <div class="card-title">每个字段含义</div>
    <div class="explain-grid" id="explainGrid"></div>
    <div class="human-read" id="humanRead"></div>
  </div>

  <!-- next runs -->
  <div class="card" id="nextCard" style="display:none">
    <div class="card-title">接下来执行时间</div>
    <ul class="next-list" id="nextList"></ul>
  </div>

  <div class="nav">
    <a href="index.html">← 首页</a>
    <a href="json-formatter.html">JSON</a>
    <a href="timestamp.html">Timestamp</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var input     = document.getElementById("cronInput");
  var errorMsg  = document.getElementById("errorMsg");
  var explainCard = document.getElementById("explainCard");
  var explainGrid = document.getElementById("explainGrid");
  var humanRead = document.getElementById("humanRead");
  var nextCard  = document.getElementById("nextCard");
  var nextList  = document.getElementById("nextList");
  var toastEl   = document.getElementById("toast");

  var FIELD_NAMES = ["分钟","小时","日","月","星期"];
  var MONTHS = ["","1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
  var WEEKS  = ["日","一","二","三","四","五","六"];

  /* ── Validation ── */
  function validateField(v, min, max) {
    if (v === "*") return true;
    /* step: */5 or 1/5 */
    if (/^\*\/\d+$/.test(v)) { var s = parseInt(v.split("/")[1]); return s >= 1 && s <= max; }
    if (/^\d+\/\d+$/.test(v)) { var p = v.split("/"); var b = parseInt(p[0]), s = parseInt(p[1]); return b >= min && b <= max && s >= 1; }
    /* range: 1-5 */
    if (/^\d+-\d+$/.test(v)) { var r = v.split("-"); return parseInt(r[0]) >= min && parseInt(r[1]) <= max; }
    /* list: 1,3,5 */
    if (/^[\d,]+$/.test(v)) return v.split(",").every(function(x){ var n = parseInt(x); return n >= min && n <= max; });
    /* single */
    if (/^\d+$/.test(v)) { var n = parseInt(v); return n >= min && n <= max; }
    return false;
  }

  function parseCron(expr) {
    var parts = expr.trim().split(/\s+/);
    if (parts.length !== 5) return { error: "需要 5 个字段，当前 " + parts.length + " 个" };
    var ranges = [[0,59],[0,23],[1,31],[1,12],[0,6]];
    for (var i = 0; i < 5; i++) {
      if (!validateField(parts[i], ranges[i][0], ranges[i][1]))
        return { error: "字段 " + (i+1) + " (" + FIELD_NAMES[i] + ") 无效: " + parts[i] };
    }
    return { error: null, parts: parts };
  }

  /* ── Human readable ── */
  function explainField(v, fieldIdx) {
    if (v === "*") {
      if (fieldIdx === 0) return "每分钟";
      if (fieldIdx === 1) return "每小时";
      if (fieldIdx === 2) return "每天";
      if (fieldIdx === 3) return "每月";
      if (fieldIdx === 4) return "每周每天";
    }
    if (/^\*\/\d+$/.test(v)) { var s = v.split("/")[1]; return "每" + s + "单位"; }
    if (/^\d+\/\d+$/.test(v)) { var p = v.split("/"); return "从 " + p[0] + " 开始每 " + p[1] + " 单位"; }
    if (/^\d+-\d+$/.test(v)) { var r = v.split("-"); return r[0] + " 到 " + r[1]; }
    if (/^[\d,]+$/.test(v)) return v;
    return v;
  }

  function humanSentence(parts) {
    var s = [];
    /* minute */
    if (parts[0] === "*") s.push("每分钟");
    else if (/^\*\/\d+$/.test(parts[0])) s.push("每 " + parts[0].split("/")[1] + " 分钟");
    else s.push("第 " + parts[0] + " 分");

    /* hour */
    if (parts[1] === "*") s.push("每小时");
    else s.push("在 " + parts[1] + " 点");

    /* day */
    if (parts[2] === "*") { /* skip */ }
    else if (/^\*\/\d+$/.test(parts[2])) s.push("每 " + parts[2].split("/")[1] + " 天");
    else s.push("在 " + parts[2] + " 号");

    /* month */
    if (parts[3] === "*") { /* skip */ }
    else s.push("在 " + parts[3] + " 月");

    /* weekday */
    if (parts[4] === "*") { /* skip */ }
    else if (/^\d+$/.test(parts[4])) s.push("星期" + WEEKS[parseInt(parts[4])]);
    else if (/^\d+-\d+$/.test(parts[4])) {
      var r = parts[4].split("-");
      s.push("星期" + WEEKS[parseInt(r[0])] + " 到 " + WEEKS[parseInt(r[1])]);
    } else s.push(parts[4]);

    return s.join("，");
  }

  /* ── Next runs ── */
  function getNextRuns(parts, count) {
    var results = [];
    var now = new Date();
    now.setSeconds(0, 0);
    var maxIter = 366 * 24 * 60;
    var iter = 0;

    while (results.length < count && iter < maxIter) {
      now.setMinutes(now.getMinutes() + 1);
      iter++;
      var m = now.getMinutes(), h = now.getHours(),
          d = now.getDate(), mo = now.getMonth() + 1,
          w = now.getDay();

      if (!matchField(parts[0], m, 0, 59)) continue;
      if (!matchField(parts[1], h, 0, 23)) continue;
      if (!matchField(parts[2], d, 1, 31)) continue;
      if (!matchField(parts[3], mo, 1, 12)) continue;
      if (!matchField(parts[4], w, 0, 6)) continue;

      results.push(new Date(now));
    }
    return results;
  }

  function matchField(expr, val, min, max) {
    if (expr === "*") return true;
    if (/^\*\/\d+$/.test(expr)) return val % parseInt(expr.split("/")[1]) === 0;
    if (/^\d+\/\d+$/.test(expr)) {
      var p = expr.split("/"); var base = parseInt(p[0]), step = parseInt(p[1]);
      return val >= base && (val - base) % step === 0;
    }
    if (/^\d+-\d+$/.test(expr)) {
      var r = expr.split("-"); return val >= parseInt(r[0]) && val <= parseInt(r[1]);
    }
    if (/^[\d,]+$/.test(expr)) return expr.split(",").indexOf(String(val)) !== -1;
    if (/^\d+$/.test(expr)) return val === parseInt(expr);
    return false;
  }

  function pad(n){ return n<10?"0"+n:n; }

  /* ── Render ── */
  function render() {
    var expr = input.value.trim();
    if (!expr) { hideAll(); return; }

    var r = parseCron(expr);
    if (r.error) {
      errorMsg.textContent = r.error; errorMsg.classList.add("show");
      explainCard.style.display = "none"; nextCard.style.display = "none";
      input.classList.add("error");
      return;
    }
    errorMsg.classList.remove("show");
    input.classList.remove("error");

    /* explain grid */
    explainCard.style.display = "";
    var html = "";
    for (var i = 0; i < 5; i++) {
      html += '<div class="explain-item">'+
        '<div class="field">'+FIELD_NAMES[i]+'</div>'+
        '<div class="val">'+r.parts[i]+'</div>'+
        '<div class="desc">'+explainField(r.parts[i], i)+'</div>'+
      '</div>';
    }
    explainGrid.innerHTML = html;
    humanRead.textContent = humanSentence(r.parts);

    /* next runs */
    nextCard.style.display = "";
    var runs = getNextRuns(r.parts, 10);
    var lis = "";
    runs.forEach(function(d, idx){
      var dateStr = d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+
                    pad(d.getHours())+":"+pad(d.getMinutes())+":00";
      var ts = Math.floor(d.getTime()/1000);
      lis += '<li>'+
        '<span class="idx'+(idx===0?' upcoming':'')+'">'+(idx+1)+'</span>'+
        dateStr+' <span style="color:var(--text-dim)">周'+WEEKS[d.getDay()]+'</span>'+
        '<span class="ts">'+ts+'</span>'+
        '<button class="copy-btn" data-txt="'+dateStr+'">复制</button>'+
      '</li>';
    });
    nextList.innerHTML = lis;

    /* bind copy */
    nextList.querySelectorAll(".copy-btn").forEach(function(b){
      b.addEventListener("click", function(){ copy(b.getAttribute("data-txt")); });
    });
  }

  function hideAll() {
    errorMsg.classList.remove("show");
    explainCard.style.display = "none";
    nextCard.style.display = "none";
    input.classList.remove("error");
  }

  /* ── Events ── */
  document.getElementById("btnParse").addEventListener("click", render);
  input.addEventListener("keydown", function(e){ if(e.key==="Enter") render(); });

  document.getElementById("presets").addEventListener("click", function(e){
    if (e.target.classList.contains("preset")) {
      input.value = e.target.textContent;
      render();
    }
  });

  /* ── Copy ── */
  function copy(text) {
    navigator.clipboard.writeText(text).then(function(){ showToast("已复制"); });
  }
  var tmr;
  function showToast(msg) {
    clearTimeout(tmr);
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    tmr = setTimeout(function(){ toastEl.classList.remove("show"); }, 1500);
  }
})();
</script>
</body>
</html>
