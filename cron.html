<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cron Expression</title>
<style>
  :root {
    --bg: #1e1e2e; --panel: #252536; --border: #3a3a5c;
    --text: #cdd6f4; --text-dim: #6c7086;
    --accent: #89b4fa; --success: #a6e3a1; --warn: #fab387; --error: #f38ba8;
    --hover: #313244; --radius: 8px; --radius-sm: 4px;
    --font-mono: "SF Mono","Fira Code","Cascadia Code","JetBrains Mono",Consolas,monospace;
    --font-sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  [data-theme="light"] {
    --bg: #f4f4f5; --panel: #ffffff; --border: #d4d4d8;
    --text: #18181b; --text-dim: #71717a;
    --accent: #2563eb; --success: #16a34a; --warn: #ea580c; --error: #dc2626;
    --hover: #e4e4e7; --scrollbar-thumb: #a1a1aa;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--font-sans); min-height: 100vh; display: flex;
  }

  /* Sidebar */
  .sidebar {
    width: 200px; flex-shrink: 0; background: var(--panel);
    border-right: 1px solid var(--border); display: flex;
    flex-direction: column; padding: 24px 0; min-height: 100vh;
  }
  .sidebar-brand {
    padding: 0 20px 20px; border-bottom: 1px solid var(--border); margin-bottom: 8px;
  }
  .sidebar-brand .name { font-size: 20px; font-weight: 700; color: var(--accent); }
  .sidebar-brand .sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .sidebar-nav { flex: 1; padding: 8px 0; }
  .sidebar-nav a {
    display: flex; align-items: center; gap: 10px; padding: 10px 20px;
    color: var(--text-dim); text-decoration: none; font-size: 14px;
    transition: all 0.12s; border-left: 3px solid transparent;
  }
  .sidebar-nav a:hover { color: var(--text); background: var(--hover); }
  .sidebar-nav a.active { color: var(--accent); border-left-color: var(--accent); background: rgba(137,180,250,0.08); }
  .sidebar-nav a .icon { font-size: 18px; width: 24px; text-align: center; flex-shrink: 0; }
  .sidebar-bottom { padding: 16px 20px; border-top: 1px solid var(--border); }
  .sidebar-bottom button {
    width: 100%; padding: 8px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); background: var(--bg);
    color: var(--text); cursor: pointer; font-size: 13px;
    font-family: var(--font-sans); transition: all 0.12s;
  }
  .sidebar-bottom button:hover { border-color: var(--accent); }

  /* Content */
  .main-content { flex: 1; overflow-y: auto; min-width: 0; }
  .container { padding: 28px 36px 40px; }

  /* card */
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
  }
  .card-title {
    font-size: 12px; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: 1px; font-weight: 600; margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .card-title::before { content: ""; width: 3px; height: 14px; background: var(--accent); border-radius: 2px; }

  /* Visual Selector */
  .field-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .field-label { width: 36px; font-size: 12px; color: var(--text-dim); text-align: right; flex-shrink: 0; }
  .options { display: flex; flex-wrap: wrap; gap: 4px; }
  .opt {
    padding: 3px 10px; border: 1px solid var(--border); border-radius: 14px;
    font-size: 11px; font-family: var(--font-mono); color: var(--text-dim);
    cursor: pointer; transition: all 0.12s; background: var(--bg); white-space: nowrap;
  }
  .opt:hover { border-color: var(--accent); color: var(--text); }
  .opt.selected { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .opt-custom { font-family: var(--font-sans); font-style: italic; padding: 3px 8px; min-width: 60px; }

  .expr-preview {
    margin-top: 12px; padding: 12px 16px; background: var(--bg);
    border-radius: var(--radius-sm); display: flex; align-items: center; gap: 12px;
  }
  .expr-preview .expr { font-family: var(--font-mono); font-size: 20px; letter-spacing: 1px; color: var(--accent); flex: 1; }
  .expr-preview .human { font-size: 13px; color: var(--text-dim); }

  .copy-sm {
    padding: 4px 12px; border: 1px solid var(--border); border-radius: 3px;
    background: transparent; color: var(--text-dim); font-size: 12px; cursor: pointer; font-family: var(--font-sans);
  }
  .copy-sm:hover { background: var(--hover); color: var(--text); }

  /* Reverse */
  .reverse-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px; }
  .rev-item {
    padding: 8px 12px; background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-sm); cursor: pointer; transition: all 0.12s; font-size: 13px; color: var(--text-dim);
  }
  .rev-item:hover { border-color: var(--accent); color: var(--text); background: var(--hover); }
  .rev-item .rev-expr { font-family: var(--font-mono); font-size: 11px; color: var(--accent); margin-top: 3px; }

  /* Run Times */
  .run-section { display: flex; gap: 16px; }
  .run-section .half { flex: 1; min-width: 0; }
  .run-list { list-style: none; font-family: var(--font-mono); font-size: 13px; }
  .run-list li {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--radius-sm);
  }
  .run-list li + li { border-top: 1px solid var(--border); }
  .run-list li .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .run-list li .dot.past { background: var(--text-dim); }
  .run-list li .dot.next { background: var(--success); }
  .run-list li .ts { color: var(--text-dim); font-size: 11px; margin-left: auto; }
  .no-data { color: var(--text-dim); font-size: 13px; padding: 8px; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #585b70; border-radius: 3px; }

  .toast {
    position: fixed; top: 20px; right: 20px; background: var(--success); color: var(--bg);
    padding: 8px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600;
    opacity: 0; transform: translateY(-10px); transition: all 0.25s; pointer-events: none; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="name">Cron</div>
    <div class="sub">定时任务表达式</div>
  </div>
  <nav class="sidebar-nav">
    <a href="index.html"><span class="icon">🏠</span> 首页</a>
    <a href="json-formatter.html"><span class="icon">{ }</span> JSON</a>
    <a href="timestamp.html"><span class="icon">⏱</span> Timestamp</a>
    <a href="cron.html" class="active"><span class="icon">🕐</span> Cron</a>
  </nav>
  <div class="sidebar-bottom">
    <button onclick="toggleTheme()" id="themeBtn">🌙 深色模式</button>
  </div>
</aside>

<div class="main-content">
<div class="container">
  <!-- Visual Selector -->
  <div class="card">
    <div class="card-title">可视化选择</div>
    <div id="selector"></div>
    <div class="expr-preview">
      <span class="expr" id="exprPreview">* * * * *</span>
      <span class="human" id="exprHuman">每分钟</span>
      <button class="copy-sm" id="copyExpr">复制</button>
    </div>
  </div>

  <!-- Reverse Parse -->
  <div class="card">
    <div class="card-title">反解析（选你想要）</div>
    <div class="reverse-grid" id="reverseGrid"></div>
  </div>

  <!-- Run Times -->
  <div class="card">
    <div class="card-title">最近 &amp; 下次执行时间</div>
    <div class="run-section">
      <div class="half">
        <div style="font-size:12px;color:var(--text-dim);margin-bottom:8px">最近 5 次</div>
        <ul class="run-list" id="pastRuns"></ul>
      </div>
      <div class="half">
        <div style="font-size:12px;color:var(--text-dim);margin-bottom:8px">接下来 5 次</div>
        <ul class="run-list" id="nextRuns"></ul>
      </div>
    </div>
  </div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var WEEKS = ["日","一","二","三","四","五","六"];
  var pad = function(n){ return n<10?"0"+n:n; };

  var FIELD_OPTIONS = [
    ["*","*/5","*/10","*/15","*/30","0","15","30","45"],
    ["*","*/2","*/3","*/6","0","6","8","9","12","18","22"],
    ["*","*/2","1","15","L"],
    ["*","1","3","6","9","12"],
    ["*","1-5","0","1","6","6,0"],
  ];
  var FIELD_NAMES = ["分钟","小时","日","月","星期"];
  var FIELD_RANGE = [[0,59],[0,23],[1,31],[1,12],[0,6]];
  var currentExpr = ["*","*","*","*","*"];

  function validateField(v, min, max) {
    if (v === "*") return true;
    if (v === "L") return true;
    if (/^\*\/\d+$/.test(v)) { var s = parseInt(v.split("/")[1]); return s >= 1 && s <= max; }
    if (/^\d+\/\d+$/.test(v)) { var p = v.split("/"); var b = parseInt(p[0]), s = parseInt(p[1]); return b >= min && b <= max && s >= 1; }
    if (/^\d+-\d+$/.test(v)) { var r = v.split("-"); return parseInt(r[0]) >= min && parseInt(r[1]) <= max; }
    if (/^[\d,]+$/.test(v)) return v.split(",").every(function(x){ var n = parseInt(x); return n >= min && n <= max; });
    if (/^\d+$/.test(v)) { var n = parseInt(v); return n >= min && n <= max; }
    return false;
  }
  function validExpr(parts) {
    if (parts.length !== 5) return false;
    for (var i = 0; i < 5; i++) {
      if (!validateField(parts[i], FIELD_RANGE[i][0], FIELD_RANGE[i][1]) && parts[i] !== "L") return false;
    }
    return true;
  }

  function humanSentence(parts) {
    var m = parts[0], h = parts[1], d = parts[2], mo = parts[3], w = parts[4];

    /* days */
    var dp = [];
    if (mo !== "*") dp.push(mo + "月");
    if (d !== "*") {
      if (d === "L") dp.push("最后一天");
      else if (/^\*\/\d+$/.test(d)) dp.push("每" + d.split("/")[1] + "天");
      else dp.push(d + "号");
    }
    if (w !== "*") {
      if (w === "1-5") dp.push("工作日");
      else if (w === "6,0" || w === "0,6") dp.push("周末");
      else if (/^\d+-\d+$/.test(w)) { var wr = w.split("-"); dp.push("周" + WEEKS[parseInt(wr[0])] + "至周" + WEEKS[parseInt(wr[1])]); }
      else if (/^\d+$/.test(w)) dp.push("周" + WEEKS[parseInt(w)]);
      else dp.push(w);
    }
    var dayStr = dp.length ? dp.join("") : "每天";

    /* combine hour+minute when both are specific values */
    var timeStr = "";
    if (/^\d+$/.test(h) && /^\d+$/.test(m)) {
      timeStr = pad(parseInt(h)) + ":" + pad(parseInt(m));
    } else if (h === "*" && m === "*") {
      timeStr = "每分钟";
    } else if (h === "*") {
      /* only minute constrained */
      if (/^\*\/\d+$/.test(m)) timeStr = "每" + m.split("/")[1] + "分钟";
      else if (m === "0") timeStr = "每小时整点";
      else timeStr = "每小时第" + m + "分";
    } else if (m === "*" || m === "0") {
      /* only hour constrained (or minute=0) */
      if (/^\*\/\d+$/.test(h)) timeStr = "每" + h.split("/")[1] + "小时" + (m === "0" ? "整点" : "");
      else timeStr = h + ":00";
    } else {
      /* both constrained, hour not specific or minute not specific */
      var hStr = /^\*\/\d+$/.test(h) ? "每" + h.split("/")[1] + "小时" : h + "点";
      var mStr = /^\*\/\d+$/.test(m) ? "每" + m.split("/")[1] + "分钟" : "第" + m + "分";
      timeStr = hStr + "内" + mStr;
    }

    if (timeStr === "每分钟" && dayStr === "每天") return "每分钟执行";
    if (dayStr === "每天" && /^每/.test(timeStr)) return timeStr;
    return dayStr + " " + timeStr;
  }

  function buildSelector() {
    var html = "";
    var labels = ["分","时","日","月","周"];
    for (var i = 0; i < 5; i++) {
      var opts = FIELD_OPTIONS[i];
      html += '<div class="field-row"><span class="field-label">'+labels[i]+'</span><div class="options">';
      for (var j = 0; j < opts.length; j++) {
        html += '<span class="opt'+(currentExpr[i]===opts[j]?" selected":"")+'" data-field="'+i+'" data-val="'+opts[j]+'">'+opts[j]+'</span>';
      }
      html += '<input class="opt opt-custom" data-field="'+i+'" placeholder="自定义" value="'+(FIELD_OPTIONS[i].indexOf(currentExpr[i])===-1&&currentExpr[i]!=="*"?currentExpr[i]:"")+'" style="width:70px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:var(--font-mono);font-size:11px;padding:3px 8px;border-radius:14px;outline:none">';
      html += '</div></div>';
    }
    document.getElementById("selector").innerHTML = html;
    document.querySelectorAll("#selector .opt:not(.opt-custom)").forEach(function(el){
      el.addEventListener("click", function(){
        currentExpr[parseInt(this.getAttribute("data-field"))] = this.getAttribute("data-val");
        updateAll();
      });
    });
    document.querySelectorAll("#selector .opt-custom").forEach(function(input){
      input.addEventListener("input", function(){
        currentExpr[parseInt(this.getAttribute("data-field"))] = this.value.trim() || "*";
        updateAll();
      });
    });
  }

  function updateAll() {
    var expr = currentExpr.join(" ");
    document.getElementById("exprPreview").textContent = expr;
    document.getElementById("exprHuman").textContent = humanSentence(currentExpr);
    buildSelector();
    renderRuns();
  }

  function matchField(expr, val) {
    if (expr === "*") return true;
    if (expr === "L") return false;
    if (/^\*\/\d+$/.test(expr)) return val % parseInt(expr.split("/")[1]) === 0;
    if (/^\d+\/\d+$/.test(expr)) { var p=expr.split("/"); return val>=parseInt(p[0])&&(val-parseInt(p[0]))%parseInt(p[1])===0; }
    if (/^\d+-\d+$/.test(expr)) { var r=expr.split("-"); return val>=parseInt(r[0])&&val<=parseInt(r[1]); }
    if (/^[\d,]+$/.test(expr)) return expr.split(",").indexOf(String(val))!==-1;
    if (/^\d+$/.test(expr)) return val===parseInt(expr);
    return false;
  }
  function matches(parts, d) {
    return matchField(parts[0],d.getMinutes())&&matchField(parts[1],d.getHours())&&
      (parts[2]==="L"?d.getDate()===new Date(d.getFullYear(),d.getMonth()+1,0).getDate():matchField(parts[2],d.getDate()))&&
      matchField(parts[3],d.getMonth()+1)&&matchField(parts[4],d.getDay());
  }

  function getRuns(parts, pastC, nextC) {
    var past=[], next=[], now=new Date(), cursor, iter=0, max=525600;
    cursor=new Date(now); cursor.setSeconds(0,0); cursor.setMinutes(cursor.getMinutes()-1);
    while(past.length<pastC&&iter<max){ cursor.setMinutes(cursor.getMinutes()-1); iter++; if(matches(parts,cursor)) past.unshift(new Date(cursor)); }
    cursor=new Date(now); cursor.setSeconds(0,0); iter=0;
    while(next.length<nextC&&iter<max){ cursor.setMinutes(cursor.getMinutes()+1); iter++; if(matches(parts,cursor)) next.push(new Date(cursor)); }
    return {past:past,next:next};
  }

  function renderRuns() {
    if (!validExpr(currentExpr)) {
      document.getElementById("pastRuns").innerHTML='<div class="no-data">表达式无效</div>';
      document.getElementById("nextRuns").innerHTML='<div class="no-data">表达式无效</div>';
      return;
    }
    var runs=getRuns(currentExpr,5,5);
    var pEl=document.getElementById("pastRuns"), nEl=document.getElementById("nextRuns");
    pEl.innerHTML=""; nEl.innerHTML="";
    runs.past.forEach(function(d){
      pEl.innerHTML+='<li><span class="dot past"></span>'+d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes())+":00 周"+WEEKS[d.getDay()]+'<span class="ts">'+Math.floor(d.getTime()/1000)+'</span></li>';
    });
    runs.next.forEach(function(d){
      nEl.innerHTML+='<li><span class="dot next"></span>'+d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes())+":00 周"+WEEKS[d.getDay()]+'<span class="ts">'+Math.floor(d.getTime()/1000)+'</span></li>';
    });
    if(!runs.past.length) pEl.innerHTML='<div class="no-data">无匹配</div>';
    if(!runs.next.length) nEl.innerHTML='<div class="no-data">无匹配</div>';
  }

  document.getElementById("copyExpr").addEventListener("click",function(){ copy(currentExpr.join(" ")); });
  document.getElementById("exprPreview").addEventListener("click",function(){ copy(currentExpr.join(" ")); });
  document.getElementById("exprPreview").style.cursor="pointer";

  var REVERSE_PRESETS=[
    {label:"每分钟",expr:"* * * * *"},{label:"每5分钟",expr:"*/5 * * * *"},
    {label:"每10分钟",expr:"*/10 * * * *"},{label:"每半小时",expr:"*/30 * * * *"},
    {label:"每小时整点",expr:"0 * * * *"},{label:"每2小时",expr:"0 */2 * * *"},
    {label:"每6小时",expr:"0 */6 * * *"},{label:"每天9点",expr:"0 9 * * *"},
    {label:"每天12点",expr:"0 12 * * *"},{label:"工作日9点",expr:"0 9 * * 1-5"},
    {label:"每周一8点",expr:"0 8 * * 1"},{label:"每周末0点",expr:"0 0 * * 6,0"},
    {label:"每月1号0点",expr:"0 0 1 * *"},{label:"每月15号9点",expr:"0 9 15 * *"},
    {label:"每月最后一天",expr:"0 0 L * *"},{label:"每年1月1日0点",expr:"0 0 1 1 *"},
  ];
  var rGrid=document.getElementById("reverseGrid");
  REVERSE_PRESETS.forEach(function(p){
    var div=document.createElement("div"); div.className="rev-item";
    div.innerHTML=p.label+'<div class="rev-expr">'+p.expr+'</div>';
    div.addEventListener("click",function(){ currentExpr=p.expr.split(" "); updateAll(); });
    rGrid.appendChild(div);
  });

  buildSelector(); renderRuns();

  /* Theme */
  var saved=localStorage.getItem("theme")||"dark";
  document.documentElement.setAttribute("data-theme",saved);
  document.getElementById("themeBtn").textContent=saved==="light"?"☀️ 浅色模式":"🌙 深色模式";
  window.toggleTheme=function(){
    var n=document.documentElement.getAttribute("data-theme")==="light"?"dark":"light";
    document.documentElement.setAttribute("data-theme",n);
    localStorage.setItem("theme",n);
    document.getElementById("themeBtn").textContent=n==="light"?"☀️ 浅色模式":"🌙 深色模式";
  };

  var tmr;
  function toast(msg){ clearTimeout(tmr); var e=document.getElementById("toast"); e.textContent=msg; e.classList.add("show"); tmr=setTimeout(function(){e.classList.remove("show")},1500); }
  function copy(text){ navigator.clipboard.writeText(text).then(function(){ toast("已复制"); }); }
})();
</script>
</body>
</html>
